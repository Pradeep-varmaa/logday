<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DayLog - Offline</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #060B1A;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #1D4ED8, #22D3EE);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(34, 211, 238, 0.4);
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }
    p {
      color: #94A3B8;
      font-size: 14px;
      max-width: 320px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    button {
      background: linear-gradient(135deg, #1D4ED8, #22D3EE);
      color: #060B1A;
      border: none;
      padding: 12px 24px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#060B1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
      <path d="M3 3v5h5"/>
      <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
      <path d="M16 16h5v5"/>
    </svg>
  </div>
  <h1>You're Offline</h1>
  <p>DayLog works offline! Any goals you logged have been saved safely to your device's IndexedDB and will sync automatically once reconnected.</p>
  <button onclick="window.location.reload()">Retry Connection</button>
</body>
</html>
